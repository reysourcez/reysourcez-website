<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Form Scanner - Reysourcez Enterprise</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="brand">Reysourcez Enterprise</a>
      <ul class="nav-links">
        <li class="nav-dropdown">
          <button type="button" class="nav-dropdown-toggle" aria-expanded="false" aria-haspopup="true">
            Business Analysis <i class="nav-dropdown-caret" aria-hidden="true"></i>
          </button>
          <ul class="nav-dropdown-menu">
            <li><a href="menu-calculator.html">Menu Calculator</a></li>
            <li><a href="overhead-manpower-calculator.html">Overhead &amp; Manpower</a></li>
            <li><a href="printing-calculator.html">Printing Calculator</a></li>
            <li><a href="interactive-costing-analysis.html">Costing Analysis</a></li>
            <li><a href="margin-audit-calculator.html">Margin Analysis</a></li>
            <li><a href="food-worth-calculator.html">Food Worth</a></li>
            <li><a href="crypto-radar.html">Crypto Radar</a></li>
            <li><a href="rental-calculator.html">Rental Calculator</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
    <h1 style="color: var(--ink, #16261F); margin-bottom: 1.5rem;">AI Form Scanner</h1>
    
    <div class="upload-area" id="fs-upload-zone" style="border: 2px dashed var(--line, #D8DCD3); padding: 2rem; text-align: center; border-radius: 8px; cursor: pointer; transition: background-color 0.2s, border-color 0.2s;">
      <p id="fs-upload-prompt" style="color: var(--muted, #5C6D64);">Click or drag & drop voucher photo or PDF here</p>
      <input type="file" id="fs-photo-input" accept="image/*, application/pdf" style="display: none;">
      
      <!-- Image Preview -->
      <img id="fs-preview-img" class="preview-img" alt="Form Preview" style="display: none; max-width: 100%; max-height: 400px; border-radius: 6px; margin-top: 1rem; margin-left: auto; margin-right: auto;">
      
      <!-- PDF Preview -->
      <div id="fs-pdf-preview" style="display: none; margin-top: 1rem; padding: 2rem; background: var(--paper, #EEF0EA); border: 1px solid var(--line, #D8DCD3); border-radius: 6px; color: var(--muted, #5C6D64);">
        <svg style="width: 48px; height: 48px; margin-bottom: 0.5rem; stroke: var(--accent, #1F6F5C);" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
        </svg><br>
        <strong style="color: var(--ink, #16261F);">PDF Document Selected</strong><br>
        <span id="fs-pdf-name" style="font-size: 0.875rem;"></span>
      </div>
    </div>

    <div style="margin-top: 1.5rem;">
      <textarea id="fs-note" placeholder="Add any specific instructions for the AI..." style="width: 100%; height: 80px; padding: 0.5rem; border: 1px solid var(--line, #D8DCD3); border-radius: 4px; resize: vertical;"></textarea>
    </div>
    
    <button id="fs-scan-btn" disabled style="margin-top: 1rem; padding: 0.75rem 1.5rem; background: var(--accent, #1F6F5C); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; opacity: 0.5;">Run AI Scan</button>
    
    <div id="fs-status" style="margin-top: 1rem; font-weight: bold; font-size: 0.9rem;"></div>
  </main>

  <script src="nav-dropdown.js?v=3" defer></script>
  <script src="form-scanner_v3.js" defer></script>
</body>
</html>
