<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Creator & Extractor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 600px; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { background-color: #0d7355; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 15px; }
        .btn:hover { background-color: #0b5e44; }
        .error-banner { background-color: #ffebee; color: #c62828; padding: 15px; border-radius: 5px; margin-top: 15px; display: none; border: 1px solid #ef9a9a; }
        .spinner { display: none; text-align: center; margin-top: 15px; font-weight: bold; color: #0d7355; }
        input[type="file"] { margin-bottom: 20px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h2>Form Structure Scanner & PDF Generator</h2>
    <input type="file" id="formFileInput" accept=".pdf,image/*">
    
    <button class="btn" id="scanExtractBtn">Scan & Extract Form Structure</button>
    <button class="btn" id="makePdfBtn" style="background-color: #2b547e;">Make Editable PDF</button>
    <button class="btn" id="exportExcelBtn" style="background-color: #2e7d32;">Export to Excel</button>

    <div class="spinner" id="loadingSpinner">Processing securely in background worker... Please wait.</div>
    <div class="error-banner" id="errorBanner"></div>
</div>

<script src="form-creator.js"></script>
</body>
</html>
